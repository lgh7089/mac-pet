name: Build

on:
  # 手动触发：Actions 页面 → Build → Run workflow
  workflow_dispatch:
  # 打 tag 时自动构建（如 git tag v1.1.0 && git push --tags）
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: release/*.exe
          - os: macos-latest
            script: dist
            artifact: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: MacPet-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
