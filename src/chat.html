<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>和小慧聊天</title>
    <link rel="stylesheet" href="./chat.css" />
  </head>
  <body>
    <header id="titlebar">
      <img id="logo" src="./logo.png" alt="MacPet" />
    </header>

    <main id="messages"></main>

    <footer id="composer">
      <textarea id="input" rows="1" placeholder="和小慧说点什么…（回车发送，Shift+回车换行）"></textarea>
      <button id="send" title="发送">↑</button>
    </footer>

    <script src="./chat.js"></script>
  </body>
</html>
